<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101115"/>
      <stop offset="100%" stop-color="#16171e"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#272832" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#272832" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#262732" fill-opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Base container -->
  <rect width="920" height="220" rx="8" fill="url(#card-bg)"/>
  <rect width="920" height="220" rx="8" fill="url(#dot-grid)"/>
  <rect x="0.5" y="0.5" width="919" height="219" rx="7.5" stroke="#262732" stroke-width="1"/>

  <!-- Top accent stripe -->
  <rect x="36" y="26" width="848" height="1.5" fill="url(#accent-line)"/>

  <!-- Kicker / Editorial metadata -->
  <g transform="translate(36, 46)">
    <circle cx="4" cy="4" r="3.5" fill="#f97316"/>
    <text x="16" y="7.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ea580c" letter-spacing="1.2">DISPATCH &amp; REPOSITORY // RAIPUR, INDIA</text>
    <text x="848" y="7.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#71717a" letter-spacing="1">21.25°N · 81.63°E</text>
  </g>

  <!-- Primary Headline -->
  <text x="36" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#fefbf6" letter-spacing="-0.5">Uday Sahu</text>

  <!-- Subtitle -->
  <text x="36" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#d4d4d8">
    B.Tech Computer Science · SSIPMT Raipur <tspan fill="#71717a">· Class of 2029</tspan>
  </text>

  <!-- Tagline quote -->
  <text x="36" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a1a1aa">
    Building practical software, experimenting with ideas, and learning by shipping real projects.
  </text>

  <!-- Bottom rule -->
  <line x1="36" y1="184" x2="884" y2="184" stroke="#20212a" stroke-width="1"/>

  <!-- Footer metadata strip inside banner -->
  <g transform="translate(36, 202)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#71717a" letter-spacing="0.8">CORE FOCUS: WEB APPLICATIONS · EMBEDDED SYSTEMS · PRODUCT PROTOTYPING</text>
    <text x="848" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#fb923c" letter-spacing="0.8">STATUS: ACTIVE</text>
  </g>
</svg>